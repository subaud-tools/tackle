# .tools family standard: identical in every family repo except the branch
# list and the gate's OS list. The same checks `just verify` runs locally.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      matrix:
        # tackle's tools target macOS and its tests exercise macOS behaviour.
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4.0.0
      - run: just prepare
      - uses: subaud-tools/tools-actions/go-ci@v0.13.0
        with:
          setup-go: "false"
  extra:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4.0.0
      # cull's and sift's pages (internal/{cull,sift}/web) are TypeScript:
      # verify-extra runs their gates and the committed-bundle
      # freshness checks.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            internal/cull/web/package-lock.json
            internal/sift/web/package-lock.json
      # setup-node's `cache: npm` caches the download cache, not node_modules.
      # Keyed on each lockfile: a hit lets `_<page>-web-deps` skip `npm ci`.
      - name: Cache cull web/node_modules
        uses: actions/cache@v6
        with:
          path: internal/cull/web/node_modules
          key: cull-web-node-modules-${{ runner.os }}-${{ hashFiles('internal/cull/web/package-lock.json') }}
      - name: Cache sift web/node_modules
        uses: actions/cache@v6
        with:
          path: internal/sift/web/node_modules
          key: sift-web-node-modules-${{ runner.os }}-${{ hashFiles('internal/sift/web/package-lock.json') }}
      - run: just verify-extra

  # The cull and sift pages in a real headless chromium (`just verify-slow`):
  # too slow for the push gate, so their own required job.
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            internal/cull/web/package-lock.json
            internal/sift/web/package-lock.json
      # setup-node's `cache: npm` caches the download cache, not node_modules.
      # Keyed on each lockfile: a hit lets `_<page>-web-deps` skip `npm ci`.
      - name: Cache cull web/node_modules
        uses: actions/cache@v6
        with:
          path: internal/cull/web/node_modules
          key: cull-web-node-modules-${{ runner.os }}-${{ hashFiles('internal/cull/web/package-lock.json') }}
      - name: Cache sift web/node_modules
        uses: actions/cache@v6
        with:
          path: internal/sift/web/node_modules
          key: sift-web-node-modules-${{ runner.os }}-${{ hashFiles('internal/sift/web/package-lock.json') }}
      - name: Install web dependencies
        run: |
          (cd internal/cull/web && { [ -d node_modules ] || npm ci; })
          (cd internal/sift/web && { [ -d node_modules ] || npm ci; })
      # playwright-core's own CLI (the version that launches), and the headless
      # shell, which is what chromium.launch() actually runs. One install serves
      # every page (the shared ms-playwright cache).
      - name: Install chromium
        working-directory: internal/cull/web
        run: node node_modules/playwright-core/cli.js install --with-deps chromium chromium-headless-shell
      - run: just verify-slow
