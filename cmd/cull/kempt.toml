# kempt manifest for cull — kept separate from any dotfiles manifest.
#
#   kempt apply   -manifest cmd/cull/kempt.toml -packages cull
#   kempt upgrade -manifest cmd/cull/kempt.toml -packages cull
#
# -packages cull is required: without it kempt applies the selection saved by
# your dotfiles `kempt init`, which does not contain "cull".
# After the first apply: run `cull init` in each project.

[kempt]
spec = 1

[packages.cull]
description = "cull: judges agent-written tests with Jev, cuts the sure ones, asks you about the rest"
only = { os = "darwin" }

  # The binary, from the family download contract (verified against .sha256).
  [[packages.cull.download]]
  site = "tackle.tools"
  tool = "cull"
  bin = "cull"

  # Claude Code: the cull plugin from the subaud-tools marketplace
  # (subaud-tools/plugins); its old cull@tackle is removed. The tackle
  # marketplace entry stays, since cull, imprint and sift share it and each
  # manifest moves only its own plugin. The next plain `claude` session installs it at user scope. Its .mcp.json runs `cull
  # channel` for the tools and its mod runs `cull watch`, which turns each of
  # Court's answers into a turn.
  [[packages.cull.json-merge]]
  file = "~/.claude/settings.json"
  merge = { extraKnownMarketplaces = { subaud-tools = { source = { source = "github", repo = "subaud-tools/plugins" }, autoUpdate = true } }, enabledPlugins = { "cull@subaud-tools" = true } }
  remove = ["enabledPlugins.cull@tackle"]

  # The bare server the plugin replaces, or the channel would start twice.
  [[packages.cull.json-merge]]
  file = "~/.claude.json"
  remove = ["mcpServers.cull"]

  # pi: the same channel through channels.tools.
  [[packages.cull.json-merge]]
  file = "~/.pi/agent/channels.json"
  merge = { channelServers = { cull = { command = "cull", args = ["channel"] } } }

  [[packages.cull.verify]]
  command-exists = "cull"
