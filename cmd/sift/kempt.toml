# kempt manifest for sift — kept separate from any dotfiles manifest.
#
#   kempt apply   -manifest cmd/sift/kempt.toml -packages sift
#   kempt upgrade -manifest cmd/sift/kempt.toml -packages sift
#
# -packages sift is required: without it kempt applies the selection saved by
# your dotfiles `kempt init`, which does not contain "sift".
# After the first apply, and after each upgrade: `sift skills install` (the
# skill is embedded in the binary, as muda's are, and kempt runs no commands),
# then `sift init --root DIR` once.

[kempt]
spec = 1

[packages.sift]
description = "sift: instruction-file audits reviewed per file, one pull request per repo, with an agent channel"
only = { os = "darwin" }
notes = [
  "Run `sift skills install` after each apply or upgrade: it installs the sift skill this binary was built with for each agent harness found.",
  "Then, once: `sift init --root DIR` (the directories to audit), and `sift doctor` to check the setup.",
]

  # The binary, from the family download contract (verified against .sha256).
  [[packages.sift.download]]
  site = "tackle.tools"
  tool = "sift"
  bin = "sift"

  # Claude Code: the sift plugin from the subaud-tools marketplace
  # (subaud-tools/plugins); the old tackle marketplace and its sift@tackle
  # are removed. The next plain `claude` session installs it at user scope. Its .mcp.json runs `sift
  # channel` for the tools and its mod runs `sift watch`, which turns each of
  # the user's Sends into a turn.
  [[packages.sift.json-merge]]
  file = "~/.claude/settings.json"
  merge = { extraKnownMarketplaces = { subaud-tools = { source = { source = "github", repo = "subaud-tools/plugins" }, autoUpdate = true } }, enabledPlugins = { "sift@subaud-tools" = true } }
  remove = ["extraKnownMarketplaces.tackle", "enabledPlugins.sift@tackle"]

  # The bare server the plugin replaces, or the channel would start twice.
  [[packages.sift.json-merge]]
  file = "~/.claude.json"
  remove = ["mcpServers.sift"]

  # pi: the same channel through channels.tools.
  [[packages.sift.json-merge]]
  file = "~/.pi/agent/channels.json"
  merge = { channelServers = { sift = { command = "sift", args = ["channel"] } } }

  [[packages.sift.verify]]
  command-exists = "sift"
